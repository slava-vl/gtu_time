name: gtu_time
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Network
  dio: ^5.11.1
  retrofit: ^4.10.0

  #BLoC
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # local storages
  shared_preferences: ^2.5.5

  # Service Locator
  get_it: ^9.3.0
  injectable: ^3.0.0

  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  nested: ^1.0.0
  equatable: ^3.0.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  flutter_gen_runner: ^5.15.0
  injectable_generator: ^3.1.3

flutter_gen:
  output: lib/core/resources
  line_length: 120

  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true

  # assets:
  #   - assets/
