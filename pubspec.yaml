name: gtu_time
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.5+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Network
  dio: ^5.11.1
  retrofit: ^4.10.0

  #BLoC
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # local storages
  shared_preferences: ^2.5.5

  # Service Locator
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Code generation
  freezed_annotation: 3.1.0
  json_annotation: ^4.12.0

  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  nested: ^1.0.0
  equatable: ^3.0.0
  rxdart: ^0.28.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  go_router: ^18.1.0

  shimmer: ^4.0.0
  material_ui: ^1.0.1
  modal_bottom_sheet: ^3.0.0
  collection: ^1.19.1
  flutter_native_splash: ^2.4.8
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  flutter_gen_runner: ^5.15.0
  injectable_generator: ^3.1.3
  hive_ce_generator: 1.11.3
  freezed: 4.0.2
  json_serializable: 

  surf_lint_rules: ^4.0.0

  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/core/resources
  line_length: 120

  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter_24pt-Regular.ttf
          weight: 400
        - asset: fonts/inter/Inter_24pt-Medium.ttf
          weight: 500
        - asset: fonts/inter/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: fonts/inter/Inter_24pt-Bold.ttf
          weight: 700
        - asset: fonts/inter/Inter_24pt-ExtraBold.ttf
          weight: 800
